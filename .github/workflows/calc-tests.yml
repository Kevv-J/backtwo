name: Calc regression

# Blocks PRs and pushes-to-main that would change viewer_template.html or the
# dex without a matching test update. Also runs on tests/ changes.
#
# 30+ golden tests cover every VGC modeled interaction — weather-defensive
# buffs, Champions Megas, item chains, ability stacks, edge cases. Adding a
# new test takes <2 min (see tests/README if present, or copy an existing
# test as a template).

on:
  pull_request:
    paths:
      - 'viewer_template.html'
      - 'data/dex.json'
      - 'tests/**'
      - '.github/workflows/calc-tests.yml'
  push:
    branches: [main]
    paths:
      - 'viewer_template.html'
      - 'data/dex.json'
      - 'tests/**'
      - '.github/workflows/calc-tests.yml'
  workflow_dispatch:

concurrency:
  group: calc-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    # Bumped from 3 min: a cold CI env needs to scrape ~1490 pokepastes on
    # first data build (build_db.py has no cache to reuse). Golden tests
    # themselves run in <1 s once the data is present.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure data/dex.json + data/teams.json exist
        # Both files are gitignored (regenerable), so on a fresh checkout we
        # need to scrape teams first (build_db.py) then build the dex/HTML
        # (build_dex.py, which reads data/teams.json at line 433).
        run: |
          if [ ! -f data/dex.json ] || [ ! -f data/teams.json ]; then
            pip install --quiet -r requirements.txt
            if [ ! -f data/teams.json ]; then
              python build_db.py
            fi
            python build_dex.py
          fi

      - name: Run golden tests
        run: node --test --test-reporter=spec tests/golden.*.js
